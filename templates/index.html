<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser ID Calling</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; font-size: 16px; }
        button { cursor: pointer; background: #007BFF; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #hangup-btn { background: #dc3545; }
        #hangup-btn:hover { background: #bd2130; }
        #answer-btn { background: #28a745; font-size: 18px; padding: 12px 20px; }
        #answer-btn:hover { background: #218838; }
        .hidden { display: none; }
        .status { font-weight: bold; color: green; }
        #incoming-container { background: #e8f5e9; border: 2px dashed #28a745; padding: 15px; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Browser ID Calling App</h1>

    <!-- Registration Section -->
    <div id="register-section" class="card">
        <h3>1. Enter Your ID</h3>
        <input type="text" id="id-input" placeholder="e.g. 456">
        <br>
        <button onclick="registerID()">Register ID</button>
    </div>

    <!-- Call Dashboard Section -->
    <div id="call-section" class="card hidden">
        <h3>2. Call Dashboard</h3>
        <p>Your ID: <b id="my-id-display"></b> <span class="status">● Online</span></p>
        
        <input type="text" id="target-id-input" placeholder="Enter recipient's ID (e.g. 121)">
        <br>
        <button id="start-call-btn" onclick="startCall()">Start Call</button>
        <button id="hangup-btn" class="hidden" onclick="hangUpCall()">Hang Up</button>

        <!-- Incoming Call UI Banner -->
        <div id="incoming-container" class="hidden">
            <p>Incoming call from ID: <b id="caller-id-display"></b></p>
            <button id="answer-btn" onclick="acceptCall()">Accept Call</button>
            <button id="hangup-btn-incoming" onclick="declineCall()" style="background: #dc3545;">Decline</button>
        </div>

        <div style="margin-top: 20px;">
            <audio id="remote-audio" autoplay></audio>
        </div>
    </div>

    <!-- Hidden Ringtone Audio -->
    <audio id="ringtone" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- Socket.IO Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        let myId = "";
        let targetId = "";
        let pendingOffer = null;
        let peerConnection = null;
        let localStream = null;
        let iceCandidateQueue = [];

        const iceServers = {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        };

        const ringtone = document.getElementById('ringtone');

        socket.on('connect', () => {
            if (myId) {
                socket.emit('register_id', myId);
            }
        });

        function registerID() {
            myId = document.getElementById('id-input').value.trim();
            if (!myId) {
                alert("Please enter a valid ID.");
                return;
            }
            socket.emit('register_id', myId);
            document.getElementById('my-id-display').innerText = myId;
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('call-section').classList.remove('hidden');

            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        async function setupMedia() {
            try {
                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                }
            } catch (err) {
                console.error("Microphone access denied:", err);
                alert("Microphone access is required for calls.");
            }
        }

        async function createPeerConnection(receiverId) {
            if (peerConnection) return;
            
            peerConnection = new RTCPeerConnection(iceServers);
            iceCandidateQueue = [];

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                const remoteAudio = document.getElementById('remote-audio');
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play().catch(err => console.log("Audio play blocked/failed:", err));
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice_candidate', {
                        target_id: receiverId,
                        candidate: event.candidate
                    });
                }
            };
        }

        async function flushIceQueue() {
            while (iceCandidateQueue.length > 0) {
                const candidate = iceCandidateQueue.shift();
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error("Error adding queued ICE candidate", e);
                }
            }
        }

        async function startCall() {
            targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId) {
                alert("Enter target ID to call.");
                return;
            }

            await setupMedia();
            if (!localStream) {
                alert("Cannot start call: Microphone access is required.");
                return;
            }

            await createPeerConnection(targetId);

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.emit('call_user', {
                target_id: targetId,
                caller_id: myId,
                offer: offer
            });

            document.getElementById('start-call-btn').classList.add('hidden');
            document.getElementById('hangup-btn').classList.remove('hidden');
        }

        socket.on('incoming_call', async (data) => {
            pendingOffer = data.offer;
            targetId = data.caller_id;

            ringtone.play().catch(err => console.log("Audio autoplay restricted:", err));

            if (Notification.permission === "granted") {
                new Notification("Incoming Call", { body: `Call from ID: ${data.caller_id}` });
            }

            // Show interactive on-screen call banner instead of blockable confirm()
            document.getElementById('caller-id-display').innerText = data.caller_id;
            document.getElementById('incoming-container').classList.remove('hidden');
            document.getElementById('start-call-btn').classList.add('hidden');
        });

        async function acceptCall() {
            ringtone.pause();
            ringtone.currentTime = 0;
            document.getElementById('incoming-container').classList.add('hidden');

            await setupMedia();
            await createPeerConnection(targetId);

            await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
            await flushIceQueue();

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.emit('make_answer', {
                caller_id: targetId,
                answer: answer
            });

            document.getElementById('hangup-btn').classList.remove('hidden');
        }

        function declineCall() {
            ringtone.pause();
            ringtone.currentTime = 0;
            document.getElementById('incoming-container').classList.add('hidden');
            document.getElementById('start-call-btn').classList.remove('hidden');
            socket.emit('hang_up', { target_id: targetId });
            targetId = "";
        }

        socket.on('call_answered', async (data) => {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                await flushIceQueue();
            }
        });

        socket.on('ice_candidate', async (data) => {
            if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (e) {
                    console.error("Error adding received ICE candidate", e);
                }
            } else {
                iceCandidateQueue.push(data.candidate);
            }
        });

        socket.on('call_failed', (data) => {
            alert(data.error);
            terminateCallLocally();
        });

        socket.on('call_ended', () => {
            terminateCallLocally();
        });

        function hangUpCall() {
            if (targetId) {
                socket.emit('hang_up', { target_id: targetId });
            }
            terminateCallLocally();
        }

        function terminateCallLocally() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            ringtone.pause();
            ringtone.currentTime = 0;
            resetCallUI();
        }

        function resetCallUI() {
            document.getElementById('start-call-btn').classList.remove('hidden');
            document.getElementById('hangup-btn').classList.add('hidden');
            document.getElementById('incoming-container').classList.add('hidden');
            targetId = "";
            pendingOffer = null;
            iceCandidateQueue = [];
        }
    </script>
</body>
</html>
