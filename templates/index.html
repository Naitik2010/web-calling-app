<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser ID Calling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f9;
            color: #333;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        input, button {
            padding: 12px;
            margin: 6px 0;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        #hangup-btn {
            background: #dc3545;
        }

        #hangup-btn:hover {
            background: #bd2130;
        }

        #logout-btn {
            background: #6c757d;
        }

        #logout-btn:hover {
            background: #545b62;
        }

        .hidden {
            display: none !important;
        }

        .status {
            font-weight: bold;
            color: green;
        }

        #incoming-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .incoming-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .incoming-box h2 {
            color: #28a745;
            margin-top: 0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-accept {
            background: #28a745 !important;
            flex: 1;
        }

        .btn-accept:hover {
            background: #218838 !important;
        }

        .btn-decline {
            background: #dc3545 !important;
            flex: 1;
        }

        .btn-decline:hover {
            background: #bd2130 !important;
        }

        .connection-status {
            font-size: 14px;
            margin-top: 8px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>Browser ID Calling App</h1>

    <!-- ========================= -->
    <!-- REGISTRATION SECTION -->
    <!-- ========================= -->

    <div id="register-section" class="card">

        <h3>1. Enter Your ID</h3>

        <input
            type="text"
            id="id-input"
            placeholder="e.g. 456"
            autocomplete="off"
        >

        <button id="register-btn" onclick="registerID()">
            Register ID
        </button>

        <div id="connection-status" class="connection-status">
            Connecting to server...
        </div>

    </div>


    <!-- ========================= -->
    <!-- CALL DASHBOARD -->
    <!-- ========================= -->

    <div id="call-section" class="card hidden">

        <h3>2. Call Dashboard</h3>

        <p>
            Your ID:
            <b id="my-id-display"></b>

            <span class="status">
                ● Online
            </span>
        </p>

        <input
            type="text"
            id="target-id-input"
            placeholder="Enter recipient's ID (e.g. 121)"
            autocomplete="off"
        >

        <button
            id="start-call-btn"
            onclick="startCall()"
        >
            Start Call
        </button>

        <button
            id="hangup-btn"
            class="hidden"
            onclick="hangUpCall()"
        >
            Hang Up
        </button>

        <button
            id="logout-btn"
            onclick="logout()"
        >
            Log Out
        </button>


        <!-- Remote audio -->

        <div style="margin-top: 20px;">

            <audio
                id="remote-audio"
                autoplay
                playsinline
                controls
                style="width:100%;"
            ></audio>

        </div>

    </div>


    <!-- ========================= -->
    <!-- INCOMING CALL OVERLAY -->
    <!-- ========================= -->

    <div id="incoming-overlay" class="hidden">

        <div class="incoming-box">

            <h2>Incoming Call!</h2>

            <p>
                From ID:
                <b
                    id="caller-id-display"
                    style="font-size: 20px;"
                ></b>
            </p>

            <div class="btn-group">

                <button
                    class="btn-accept"
                    onclick="acceptCall()"
                >
                    Accept
                </button>

                <button
                    class="btn-decline"
                    onclick="declineCall()"
                >
                    Decline
                </button>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- RINGTONE -->
    <!-- ========================= -->

    <audio id="ringtone" loop>
        <source
            src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- ========================= -->
    <!-- SOCKET.IO -->
    <!-- ========================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>


    <script>

        /* =====================================================
           SOCKET + GLOBAL VARIABLES
        ===================================================== */

        const socket = io();

        let myId = "";
        let targetId = "";

        let pendingOffer = null;

        let peerConnection = null;

        let localStream = null;

        let iceCandidateQueue = [];


        /* =====================================================
           LOCAL STORAGE KEYS
        ===================================================== */

        const SAVED_ID_KEY = "calling_app_user_id";

        const SESSION_TOKEN_KEY = "calling_app_session_token";


        /* =====================================================
           WEBRTC STUN SERVER
        ===================================================== */

        const iceServers = {

            iceServers: [

                {
                    urls: "stun:stun.l.google.com:19302"
                }

            ]

        };


        /* =====================================================
           AUDIO ELEMENT
        ===================================================== */

        const ringtone =
            document.getElementById("ringtone");


        /* =====================================================
           SOCKET CONNECTED
        ===================================================== */

        socket.on("connect", () => {

            console.log("Connected to server.");

            document.getElementById(
                "connection-status"
            ).innerText = "Connected to server.";

            /*
             * Check whether we already have
             * a saved login session.
             */

            const savedId =
                localStorage.getItem(SAVED_ID_KEY);

            const savedToken =
                localStorage.getItem(SESSION_TOKEN_KEY);


            if (savedId && savedToken) {

                console.log(
                    "Restoring saved session for ID:",
                    savedId
                );

                myId = savedId;

                socket.emit("register_id", {

                    user_id: savedId,

                    session_token: savedToken

                });

            }

        });


        /* =====================================================
           SOCKET DISCONNECTED
        ===================================================== */

        socket.on("disconnect", () => {

            console.log("Disconnected from server.");

            document.getElementById(
                "connection-status"
            ).innerText = "Disconnected. Reconnecting...";

        });


        /* =====================================================
           MANUAL REGISTRATION
        ===================================================== */

        function registerID() {

            const enteredId =
                document.getElementById("id-input")
                    .value
                    .trim();


            if (!enteredId) {

                alert("Please enter a valid ID.");

                return;

            }


            /*
             * Empty token tells the server:
             * "This is a brand-new registration."
             */

            myId = enteredId;


            const registerButton =
                document.getElementById("register-btn");


            registerButton.disabled = true;

            registerButton.innerText =
                "Registering...";


            socket.emit("register_id", {

                user_id: enteredId,

                session_token: ""

            });

        }


        /* =====================================================
           REGISTRATION SUCCESS
        ===================================================== */

        socket.on("registration_success", (data) => {

            console.log(
                "Registration successful:",
                data
            );


            /*
             * Server sends back:
             *
             * user_id
             * session_token
             */

            myId = data.user_id;


            /*
             * Save the login information.
             *
             * This means:
             *
             * Reload      -> stays logged in
             * Close tab   -> stays logged in
             * Close browser -> stays logged in
             */

            localStorage.setItem(
                SAVED_ID_KEY,
                data.user_id
            );


            localStorage.setItem(
                SESSION_TOKEN_KEY,
                data.session_token
            );


            showCallDashboard();

        });


        /* =====================================================
           REGISTRATION FAILED
        ===================================================== */

        socket.on("registration_failed", (data) => {

            console.log(
                "Registration failed:",
                data
            );


            /*
             * If an old session token is invalid,
             * remove it so the user can register again.
             */

            if (data.error) {

                alert(data.error);

            }


            const registerButton =
                document.getElementById("register-btn");


            registerButton.disabled = false;

            registerButton.innerText =
                "Register ID";

        });


        /* =====================================================
           SHOW CALL DASHBOARD
        ===================================================== */

        function showCallDashboard() {

            document.getElementById(
                "my-id-display"
            ).innerText = myId;


            document.getElementById(
                "register-section"
            ).classList.add("hidden");


            document.getElementById(
                "call-section"
            ).classList.remove("hidden");

        }


        /* =====================================================
           LOG OUT
        ===================================================== */

        function logout() {

            /*
             * Don't allow logout while a call is active
             * without first ending it.
             */

            if (peerConnection) {

                hangUpCall();

            }


            const token =
                localStorage.getItem(
                    SESSION_TOKEN_KEY
                );


            /*
             * Tell server to remove the session.
             */

            socket.emit("logout", {

                user_id: myId,

                session_token: token

            });

        }


        /* =====================================================
           LOGOUT SUCCESS
        ===================================================== */

        socket.on("logout_success", () => {

            console.log(
                "Logged out successfully."
            );


            /*
             * Remove saved login information.
             */

            localStorage.removeItem(
                SAVED_ID_KEY
            );

            localStorage.removeItem(
                SESSION_TOKEN_KEY
            );


            /*
             * Reset variables.
             */

            myId = "";

            targetId = "";

            pendingOffer = null;


            /*
             * Reset input.
             */

            document.getElementById(
                "id-input"
            ).value = "";


            document.getElementById(
                "target-id-input"
            ).value = "";


            /*
             * Return to registration screen.
             */

            document.getElementById(
                "call-section"
            ).classList.add("hidden");


            document.getElementById(
                "register-section"
            ).classList.remove("hidden");


            /*
             * Reset button.
             */

            const registerButton =
                document.getElementById("register-btn");


            registerButton.disabled = false;

            registerButton.innerText =
                "Register ID";

        });


        /* =====================================================
           LOGOUT FAILED
        ===================================================== */

        socket.on("logout_failed", (data) => {

            alert(
                data.error ||
                "Logout failed."
            );

        });


        /* =====================================================
           MICROPHONE SETUP
        ===================================================== */

        async function setupMedia() {

            try {

                if (!localStream) {

                    /*
                     * Request microphone.
                     *
                     * These settings help with
                     * normal voice calls.
                     */

                    localStream =
                        await navigator.mediaDevices
                            .getUserMedia({

                                audio: {

                                    echoCancellation: true,

                                    noiseSuppression: true,

                                    autoGainControl: true

                                },

                                video: false

                            });

                }


                localStream
                    .getAudioTracks()
                    .forEach(track => {

                        track.enabled = true;

                    });


            } catch (err) {

                console.error(
                    "Microphone access denied:",
                    err
                );


                alert(
                    "Microphone access is required for calls. Please check your browser/iPhone settings."
                );

            }

        }


        /* =====================================================
           CREATE PEER CONNECTION
        ===================================================== */

        async function createPeerConnection(receiverId) {

            if (peerConnection) {

                return;

            }


            peerConnection =
                new RTCPeerConnection(
                    iceServers
                );


            iceCandidateQueue = [];


            /*
             * Add local microphone tracks.
             */

            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(track => {

                        peerConnection.addTrack(
                            track,
                            localStream
                        );

                    });

            }


            /* =============================================
               RECEIVE REMOTE AUDIO
            ============================================= */

            peerConnection.ontrack =
                (event) => {

                    const remoteAudio =
                        document.getElementById(
                            "remote-audio"
                        );


                    if (
                        remoteAudio.srcObject !==
                        event.streams[0]
                    ) {

                        remoteAudio.srcObject =
                            event.streams[0];


                        /*
                         * Try to start audio.
                         */

                        remoteAudio
                            .play()
                            .then(() => {

                                console.log(
                                    "Remote audio playing successfully"
                                );

                            })
                            .catch(err => {

                                console.log(
                                    "Audio play restriction:",
                                    err
                                );

                            });

                    }

                };


            /* =============================================
               ICE CANDIDATES
            ============================================= */

            peerConnection.onicecandidate =
                (event) => {

                    if (event.candidate) {

                        socket.emit(
                            "ice_candidate",
                            {

                                target_id:
                                    receiverId,

                                candidate:
                                    event.candidate

                            }
                        );

                    }

                };

        }


        /* =====================================================
           FLUSH ICE QUEUE
        ===================================================== */

        async function flushIceQueue() {

            while (
                iceCandidateQueue.length > 0
            ) {

                const candidate =
                    iceCandidateQueue.shift();


                try {

                    await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                } catch (e) {

                    console.error(
                        "Error adding queued ICE candidate",
                        e
                    );

                }

            }

        }


        /* =====================================================
           START CALL
        ===================================================== */

        async function startCall() {

            targetId =
                document.getElementById(
                    "target-id-input"
                ).value.trim();


            if (!targetId) {

                alert(
                    "Enter target ID to call."
                );

                return;

            }


            /*
             * Get microphone inside the button
             * click event.
             *
             * This is especially important
             * for iOS Safari.
             */

            await setupMedia();


            if (!localStream) {

                alert(
                    "Cannot start call: Microphone permission was blocked."
                );

                return;

            }


            await createPeerConnection(
                targetId
            );


            const offer =
                await peerConnection
                    .createOffer();


            await peerConnection
                .setLocalDescription(
                    offer
                );


            socket.emit(
                "call_user",
                {

                    target_id: targetId,

                    caller_id: myId,

                    offer: offer

                }
            );


            /*
             * Change buttons.
             */

            document.getElementById(
                "start-call-btn"
            ).classList.add("hidden");


            document.getElementById(
                "hangup-btn"
            ).classList.remove("hidden");

        }


        /* =====================================================
           INCOMING CALL
        ===================================================== */

        socket.on(
            "incoming_call",
            async (data) => {

                console.log(
                    "Incoming call from:",
                    data.caller_id
                );


                pendingOffer =
                    data.offer;


                targetId =
                    data.caller_id;


                /*
                 * Start ringtone.
                 */

                ringtone
                    .play()
                    .catch(err => {

                        console.log(
                            "Audio autoplay restricted:",
                            err
                        );

                    });


                /*
                 * Display caller ID.
                 */

                document.getElementById(
                    "caller-id-display"
                ).innerText =
                    data.caller_id;


                /*
                 * Show incoming call UI.
                 */

                document.getElementById(
                    "incoming-overlay"
                ).classList.remove(
                    "hidden"
                );

            }
        );


        /* =====================================================
           ACCEPT CALL
        ===================================================== */

        async function acceptCall() {

            /*
             * Stop ringtone.
             */

            ringtone.pause();

            ringtone.currentTime = 0;


            /*
             * Hide incoming call overlay.
             */

            document.getElementById(
                "incoming-overlay"
            ).classList.add(
                "hidden"
            );


            /*
             * Get microphone directly
             * from Accept button action.
             */

            await setupMedia();


            if (!localStream) {

                alert(
                    "Microphone permission is required."
                );

                return;

            }


            await createPeerConnection(
                targetId
            );


            /*
             * Set caller's offer.
             */

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        pendingOffer
                    )
                );


            /*
             * Add any ICE candidates
             * that arrived early.
             */

            await flushIceQueue();


            /*
             * Create answer.
             */

            const answer =
                await peerConnection
                    .createAnswer();


            await peerConnection
                .setLocalDescription(
                    answer
                );


            /*
             * Send answer back to caller.
             */

            socket.emit(
                "make_answer",
                {

                    caller_id:
                        targetId,

                    answer:
                        answer

                }
            );


            /*
             * Change buttons.
             */

            document.getElementById(
                "start-call-btn"
            ).classList.add(
                "hidden"
            );


            document.getElementById(
                "hangup-btn"
            ).classList.remove(
                "hidden"
            );

        }


        /* =====================================================
           DECLINE CALL
        ===================================================== */

        function declineCall() {

            ringtone.pause();

            ringtone.currentTime = 0;


            document.getElementById(
                "incoming-overlay"
            ).classList.add(
                "hidden"
            );


            socket.emit(
                "hang_up",
                {

                    target_id:
                        targetId

                }
            );


            targetId = "";

            pendingOffer = null;

        }


        /* =====================================================
           CALL ANSWERED
        ===================================================== */

        socket.on(
            "call_answered",
            async (data) => {

                if (!peerConnection) {

                    return;

                }


                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            data.answer
                        )
                    );


                /*
                 * Try to unlock remote audio.
                 */

                boxAudioUnlock();


                /*
                 * Process queued ICE.
                 */

                await flushIceQueue();

            }
        );


        /* =====================================================
           AUDIO UNLOCK HELPER
        ===================================================== */

        function boxAudioUnlock() {

            const remoteAudio =
                document.getElementById(
                    "remote-audio"
                );


            remoteAudio
                .play()
                .catch(e => {

                    console.log(
                        "Audio unlock error:",
                        e
                    );

                });

        }


        /* =====================================================
           ICE CANDIDATE RECEIVED
        ===================================================== */

        socket.on(
            "ice_candidate",
            async (data) => {

                /*
                 * If remote description is already
                 * available, add candidate immediately.
                 */

                if (
                    peerConnection &&
                    peerConnection.remoteDescription &&
                    peerConnection.remoteDescription.type
                ) {

                    try {

                        await peerConnection
                            .addIceCandidate(
                                new RTCIceCandidate(
                                    data.candidate
                                )
                            );

                    } catch (e) {

                        console.error(
                            "Error adding received ICE candidate",
                            e
                        );

                    }

                }

                /*
                 * Otherwise store it until
                 * remote description is ready.
                 */

                else {

                    iceCandidateQueue.push(
                        data.candidate
                    );

                }

            }
        );


        /* =====================================================
           CALL FAILED
        ===================================================== */

        socket.on(
            "call_failed",
            (data) => {

                alert(
                    data.error ||
                    "Call failed."
                );


                terminateCallLocally();

            }
        );


        /* =====================================================
           CALL ENDED
        ===================================================== */

        socket.on(
            "call_ended",
            () => {

                terminateCallLocally();

            }
        );


        /* =====================================================
           HANG UP
        ===================================================== */

        function hangUpCall() {

            if (targetId) {

                socket.emit(
                    "hang_up",
                    {

                        target_id:
                            targetId

                    }
                );

            }


            terminateCallLocally();

        }


        /* =====================================================
           TERMINATE LOCAL CALL
        ===================================================== */

        function terminateCallLocally() {

            if (peerConnection) {

                peerConnection.close();

                peerConnection = null;

            }


            /*
             * Stop ringtone.
             */

            ringtone.pause();

            ringtone.currentTime = 0;


            /*
             * Reset call UI.
             */

            resetCallUI();

        }


        /* =====================================================
           RESET CALL UI
        ===================================================== */

        function resetCallUI() {

            document.getElementById(
                "start-call-btn"
            ).classList.remove(
                "hidden"
            );


            document.getElementById(
                "hangup-btn"
            ).classList.add(
                "hidden"
            );


            document.getElementById(
                "incoming-overlay"
            ).classList.add(
                "hidden"
            );


            targetId = "";

            pendingOffer = null;

            iceCandidateQueue = [];

        }

    </script>

</body>
</html>
